version: 2

project_name: atlas

before:
  hooks:
    - go run github.com/tc-hib/go-winres@latest make --in cmd/atlas/winres.json --out cmd/atlas/rsrc --arch amd64,arm64 --product-version {{ .Version }} --file-version {{ .Version }}

builds:
  - id: atlas
    main: ./cmd/atlas
    binary: atlas

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

    flags:
      - -trimpath

    ldflags:
      - -s -w
      - -X github.com/Yashh56/atlas/internal/version.Version={{ .Version }}

archives:
  - formats:
      - tar.gz

    name_template: >-
      {{ .ProjectName }}_
      {{ .Version }}_
      {{ title .Os }}_
      {{ if eq .Arch "amd64" }}x86_64
      {{ else }}{{ .Arch }}{{ end }}

    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: Yashh56
    name: atlas
